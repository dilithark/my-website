<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — 3dify.printz</title>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Plus+Jakarta+Sans:wght@700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root { 
    --bg: #F7F5F0; 
    --bg-raised: #EFECE6; 
    --surface: #FFFFFF; 
    --line: #E1DDD5; 
    --line-dark: #121212; 
    --text: #121212; 
    --muted: #4a4845; 
    --accent: #E0533C; 
    --radius-pill: 100px;
    --display: 'Italiana', serif; 
    --body: 'Plus Jakarta Sans', sans-serif; 
    --mono: 'Space Mono', monospace; 
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--body); font-weight: 700; line-height: 1.6; }
  a { color:inherit; text-decoration:none; }
  .wrap { max-width:1240px; margin:0 auto; padding:0 36px; }
  
  header { position: sticky; top: 0; z-index: 50; background: rgba(247, 245, 240, 0.90); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 22px 36px; max-width: 1240px; margin: 0 auto; gap: 16px; }
  .logo { font-family: var(--display); font-weight: 700; font-size: 1.5rem; text-transform: uppercase; }
  .nav-links { display: flex; gap: 32px; font-size: 0.88rem; text-transform: uppercase; color: var(--muted); }
  .nav-links a.active { color: var(--text); border-bottom: 2px solid var(--text); }

  .btn { display: inline-flex; align-items: center; gap: 10px; font-family: var(--body); font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; padding: 12px 24px; border-radius: var(--radius-pill); border: 2px solid var(--text); cursor: pointer; transition: all .25s ease; white-space: nowrap; }
  .btn-primary { background: var(--text); color: var(--bg); }
  .btn-primary:hover { background: var(--accent); border-color: var(--accent); color: #fff; transform: translateY(-2px); }
  
  .page-head { padding: 72px 0 48px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 24px; }
  .page-head h1 { font-family: var(--display); font-size: clamp(2.5rem, 5vw, 4rem); text-transform: uppercase; }
  
  section.pad { padding: 72px 0 112px; }
  .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 28px; }
  .ticket { background: var(--surface); border: 1px solid var(--line); transition: all .3s ease; display: flex; flex-direction: column; }
  .ticket:hover { border-color: var(--text); transform: translateY(-4px); }
  .ticket-img-wrap { aspect-ratio: 4/3; background: var(--bg-raised); border-bottom: 1px solid var(--line); overflow: hidden; }
  .ticket-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
  .ticket:hover .ticket-img { transform: scale(1.04); }
  .ticket-body { padding: 24px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
  .ticket-title { font-family: var(--display); font-size: 1.35rem; margin-bottom: 16px; text-transform: uppercase; }
  .ticket-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-family: var(--mono); font-size: 0.7rem; color: var(--muted); padding-top: 16px; border-top: 1px solid var(--line); text-transform: uppercase; }
  .ticket-meta b { color: var(--text); display: block; margin-bottom: 2px; }

  .cta-banner { margin-top: 72px; padding: 48px; background: var(--surface); border: 1px solid var(--line); text-align: center; }
  .cta-banner h2 { font-family: var(--display); font-size: 2rem; text-transform: uppercase; margin-bottom: 12px; }
  .cta-banner p { color: var(--muted); margin-bottom: 24px; }
</style>
</head>
<body>
<header>
  <nav>
    <a href="index.html" class="logo">3dify.printz</a>
    <div class="nav-links">
      <a href="portfolio.html" class="active">Portfolio</a>
      <a href="materials.html">Materials</a>
      <a href="process.html">Process</a>
      <a href="reviews.html">Reviews</a>
    </div>
    <a class="btn btn-primary wa-btn" href="#" target="_blank">Get Quote</a>
  </nav>
</header>
<main>
  <div class="page-head">
    <div class="wrap" style="width: 100%;">
      <h1>Selected Works</h1>
      <p>A curated overview of custom fabrications, prototype iterations, and functional components.</p>
    </div>
  </div>
  <section class="pad">
    <div class="wrap">
      <div class="gallery-grid" id="gallery-grid"></div>

      <div class="cta-banner">
        <h2>Have a custom project in mind?</h2>
        <p>Send us your 3D file or concept for an instant quote and print evaluation.</p>
        <a class="btn btn-primary wa-btn" href="#" target="_blank">Get Custom Quote</a>
      </div>
    </div>
  </section>
</main>
<script>
  const WA_NUMBER = "94764892775"; 
  const waLink = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent("Hello! I saw your portfolio and would like to get a quote for my project.")}`;
  document.querySelectorAll('.wa-btn').forEach(el => el.href = waLink);

  const jobs = [
    { title: "Drone Arm Assembly", material: "PETG", layer: "0.20mm", time: "3h 40m", qty: "×2", img: "1.jpeg" },
    { title: "Cosplay Helmet Shell", material: "PLA+", layer: "0.16mm", time: "11h 05m", qty: "×1", img: "WhatsApp Image 2026-08-13 at 22.24.41.jpeg" },
    { title: "Robot Arm", material: "PETG", layer: "0.24mm", time: "5h 15m", qty: "×12", img: "3.jpeg" },
    { title: "Fine Figurine Edition", material: "Resin", layer: "0.03mm", time: "5h 20m", qty: "×6", img: "pic/4.png" },
    { title: "Camera Rig Mount", material: "ABS", layer: "0.20mm", time: "2h 50m", qty: "×1", img: "pic/5.png" },
    { title: "Sensor Enclosure Prototype", material: "PLA", layer: "0.12mm", time: "6h 15m", qty: "×1", img: "pic/1.png" },
  ];

  document.getElementById('gallery-grid').innerHTML = jobs.map(j => `
    <div class="ticket">
      <div class="ticket-img-wrap">
        <img class="ticket-img" src="${j.img}" alt="${j.title} 3D Print" loading="lazy">
      </div>
      <div class="ticket-body">
        <div class="ticket-title">${j.title}</div>
        <div class="ticket-meta">
          <div><b>${j.material}</b><span>Polymer</span></div>
          <div><b>${j.qty}</b><span>Volume</span></div>
          <div><b>${j.layer}</b><span>Resolution</span></div>
          <div><b>${j.time}</b><span>Duration</span></div>
        </div>
      </div>
    </div>
  `).join('');
</script>
</body>
</html>
